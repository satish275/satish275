name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=7C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=B197FC

      - name: Commit updated snake images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-snake.svg dist/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake is unchanged."
            exit 0
          fi
          git commit -m "Update contribution snake"
          git push origin "HEAD:${GITHUB_REF_NAME}"